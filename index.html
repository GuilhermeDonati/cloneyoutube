<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CLONE DO YOUTUBE">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=add,menu,mic,notifications,search" />  
    <link rel="stylesheet" href="./css/style.css">
    <title>YOUTUBE</title>
</head>

<body>

    <header>

        <div class="menu">

            <button class="menuSanduiche" type="button" aria-label="abrir o menu">
                <span class="material-symbols-outlined">
                    menu
                </span>
            </button>

            <a  class="linkLogoYoutube" href="https://youtube.com" target="_blank" rel="noopener noreferrer nofollow">

                <span class="logoYoutube">
                    YouTube
                </span>

            </a>

        </div>

        <div class="secaoPesquisa">

            <form action="/resultado" method="get">

                <input type="search" class="campoPesquisa" name="q" placeholder="Pesquisa">

                <button type="submit" class="botaoPesquisa">

                    <span class="material-symbols-outlined">
                        search
                    </span>
                    

                </button>

            </form>

            <button class="pesquisaVoz" type="button" aria-label="Pesquisa por voz" id="pesquisaPorvoz">
                <span class="material-symbols-outlined">
                    mic
                </span>
            </button>

        </div>

        <div class="conjunto-perfil">

            <button class="criarPost" type="button" aria-label="criar post e abrir live" id="criarPost">

                <span class="material-symbols-outlined">
                    add
                </span>

                <span>CRIAR</span>

            </button>

            <button class="iconeNotificao"  type="button" aria-label="notificacoes do site" id="notificacoes">

                <span class="material-symbols-outlined">
                    notifications
                </span>

            </button>

            <button class="fotoPerfil" type="button" aria-label="perfil" id="perfil-usuario">
                <img  src="assets/guilherme.jpg" alt="foto de perfil" width="200" height="200">
            </button>

        </div>

    </header>

    <main>

            <nav class="filtroPesquisa">
                <ul>
                    <li><button type="button">Lorem ipsum dol amet</button></li>
                    <li><button type="button">Lorem  amet</button></li>
                    <li><button type="button">Lorem</button></li>
                    <li><button type="button">Lorem ipslor s amet</button></li>
                    <li><button type="button">Lorem ipsolamet</button></li>
                    <li><button type="button">Loremm dlor sit amet</button></li>
                    <li><button type="button">Lorem ipsum doloit amet</button></li>
                    <li><button type="button">Lorem ipsum  sit amet</button></li>
                    <li><button type="button">Lorem m dolor et</button></li>
                </ul>
            </nav>
        
        <section class="conteudoPaginaInicial">

            <section class="videosLongos">

                <article class="cardVideoLongo">

                    <img src="assets/videoframe1.png" alt="Capa de video" width="640" height="360">

                    <div class="informacoesTumbVideo">

                        <div class="imagemCanal">
                            <img src="assets/rodrigo.jpg" alt="fotoCanal" width="160" height="160">
                        </div>

                        <div class="informacoesVideo">

                            <h2 class="tituloVideo">Lorem ipsum dolor sit amet</h2>
                            <p class="nomeCanal">ipsum dolor</p>

                            <div class="videoStatus">

                                <p class="visualizacoes">2.352 mil visualizacoes</p>

                               
                                <p class="tempoPostagem">1 ano</p>
                               
                                
                            </div>
                            
                        </div>
 
                    </div>

                </article>

                <article class="cardVideoLongo">

                    <img src="assets/videoframe2.png" alt="Capa de video" width="640" height="360">

                    <div class="informacoesTumbVideo">

                        <div class="imagemCanal">
                            <img src="assets/ryan .jpg" alt="fotoCanal" width="160" height="160">
                        </div>

                        <div class="informacoesVideo">

                            <h2 class="tituloVideo">Lorem ipsum dolor sit amet</h2>
                            <p class="nomeCanal">ipsum dolor</p>

                            <div class="videoStatus">

                                <p class="visualizacoes">5.899 mil visualizacoes</p>

                                
                                <p class="tempoPostagem">ha 1 mes</p>
                                
                                
                            </div>
                            
                        </div>
 
                    </div>

                </article>

                <article class="cardVideoLongo">

                    <img src="assets/videoframe3.png" alt="Capa de video" width="640" height="360">

                    <div class="informacoesTumbVideo">

                        <div class="imagemCanal">
                            <img src="assets/fotoperfil3.jpg" alt="fotoCanal" width="160" height="160">
                        </div>

                        <div class="informacoesVideo">

                            <h2 class="tituloVideo">Lorem ipsum dolor sit amet</h2>
                            <p class="nomeCanal">Lorem ipsum</p>

                            <div class="videoStatus">

                                <p class="visualizacoes">5 visualizacoes</p>

                               
                                <p class="tempoPostagem">ha 1 min</p>
                              
                                
                            </div>
                            
                        </div>
 
                    </div>

                </article>

            </section>

            

            <section class="videosCurtos">

            </section>

        </section>
        
    </main>
</body>
</html>
